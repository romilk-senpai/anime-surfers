server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Build files keep the same names between builds, so always revalidate (ETag).
    add_header Cache-Control "no-cache";

    # Unity Brotli-compressed build files: tell the browser how they're encoded.
    location ~ .+\.(data|symbols\.json)\.br$ {
        gzip off;
        add_header Content-Encoding br;
        add_header Cache-Control "no-cache";
        default_type application/octet-stream;
    }

    location ~ .+\.js\.br$ {
        gzip off;
        add_header Content-Encoding br;
        add_header Cache-Control "no-cache";
        default_type application/javascript;
    }

    location ~ .+\.wasm\.br$ {
        gzip off;
        add_header Content-Encoding br;
        add_header Cache-Control "no-cache";
        default_type application/wasm;
    }
}
